[package]
name = "anixart-arch"
version = "0.4.1"
edition = "2021"
rust-version = "1.92"
description = "Unofficial native Linux Arch client experiment for Anixart"
license = "GPL-3.0-or-later"
repository = "https://github.com/n3koBomb/anixart-arch"

[[bin]]
name = "anixart"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
log = "0.4"
env_logger = "0.11"
reqwest = { version = "^0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
webkit6 = "0.6.1"
